function bumpReps(reps, weekIdx) {
  const m = /^(\d+)(.*)$/.exec(reps.trim());
  if (!m) return reps;
  const base = parseInt(m[1], 10);
  const suffix = m[2];
  const add = [0, 2, 2, 4][weekIdx] || 0;
  if (reps.includes("sec")) return `${base + add}${suffix}`;
  return `${base + add}${suffix}`;
}

const SETTINGS_KEY = "undercover-smashprep-settings";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", e);
  }
}

/* ----------------------------- PLAN BUILDING ----------------------------- */

function buildDayGroups(daysPerWeek) {
  const days = Array.from({ length: daysPerWeek }, () => []);
  CATEGORIES.forEach((cat, catIdx) => {
    const list = EXERCISES.filter((e) => e.category === cat.id);
    list.forEach((ex, i) => {
      const dayIdx = (i + catIdx) % daysPerWeek;
      days[dayIdx].push(ex);
    });
  });
  return days;
}

/* ----------------------------- SHARED UI ----------------------------- */

function CategoryDot({ id }) {
  const cat = CATEGORIES.find((c) => c.id === id);
  return <span className="cat-dot" style={{ background: cat?.color }} />;
}

function ExerciseCard({ ex, onOpen, done }) {
  const cat = CATEGORIES.find((c) => c.id === ex.category);
  return (
    <button className="ex-card" onClick={() => onOpen(ex)}>
      <div className="ex-card-demo">
        <ExerciseDemo pattern={ex.pattern} accent={cat?.color} />
        {done && (
          <div className="ex-done-badge">
            <CheckCircle2 size={16} />
          </div>
        )}
      </div>
      <div className="ex-card-body">
        <div className="ex-card-cat">
          <CategoryDot id={ex.category} />
          <span>{cat?.short}</span>
          <span className="ex-card-diff">{ex.difficulty}</span>
        </div>
        <div className="ex-card-name">{ex.name}</div>
        <div className="ex-card-meta">{ex.sets} × {ex.reps}</div>
      </div>
    </button>
  );
}

function ExerciseModal({ ex, onClose, onLog, existingLog }) {
  const [sets, setSets] = useState(existingLog?.sets ?? ex.sets);
  const [reps, setReps] = useState(existingLog?.reps ?? ex.reps);
  const [weight, setWeight] = useState(existingLog?.weight ?? "");
  const cat = CATEGORIES.find((c) => c.id === ex.category);

  if (!ex) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><X size={18} /></button>
        <div className="modal-demo">
          {ex.video ? (
            <iframe
              className="modal-video"
              src={`https://www.youtube.com/embed/${ex.video}?rel=0&modestbranding=1`}
              title={`${ex.name} demo`}
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
          ) : (
            <ExerciseDemo pattern={ex.pattern} accent={cat?.color} />
          )}
        </div>
        {ex.video && (
          <a className="video-source-link" href={`https://www.youtube.com/watch?v=${ex.video}`} target="_blank" rel="noopener noreferrer">
            Open on YouTube ↗
          </a>
        )}
        <div className="modal-cat">
          <CategoryDot id={ex.category} /> {cat?.label} · {ex.difficulty}
        </div>
        <h2 className="modal-title">{ex.name}</h2>
        <p className="modal-cue">{ex.cue}</p>
        <div className="modal-equip">
          {ex.equipment.map((eq) => (
            <span className="chip" key={eq}>{EQUIPMENT.find((e) => e.id === eq)?.label}</span>
          ))}
        </div>

          <div className="modal-log-row">
            <label>Sets<input type="number" min="1" value={sets} onChange={(e) => setSets(e.target.value)} /></label>

            <label>Weight<input type="text" placeholder="optional" value={weight} onChange={(e) => setWeight(e.target.value)} /></label>

function LibraryView({ logs, onOpen }) {
  const [catFilter, setCatFilter] = useState("all");
  const [equipFilter, setEquipFilter] = useState("all");

  const filtered = EXERCISES.filter(
    (ex) =>
      (catFilter === "all" || ex.category === catFilter) &&
      (equipFilter === "all" || ex.equipment.includes(equipFilter))
  );

  return (
    <div>
      <div className="filters">
        <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)}>
          <option value="all">All categories</option>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
        <select value={equipFilter} onChange={(e) => setEquipFilter(e.target.value)}>
          <option value="all">All equipment</option>
          {EQUIPMENT.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
        </select>
        <span className="filter-count">{filtered.length} exercises</span>
      </div>
      <div className="ex-grid">
        {filtered.map((ex) => (
          <ExerciseCard key={ex.id} ex={ex} onOpen={onOpen} done={!!logs[dayKeyFor(ex.id)]} />
        ))}
      </div>
    </div>
  );
}

function dayKeyFor(exId, dateStr) {
  const d = dateStr || new Date().toISOString().slice(0, 10);
  return `${d}_${exId}`;
}

function WeeklyView({ daysPerWeek, logs, onOpen }) {
  const dayGroups = useMemo(() => buildDayGroups(daysPerWeek), [daysPerWeek]);
  const [activeDay, setActiveDay] = useState(0);
  useEffect(() => { if (activeDay >= daysPerWeek) setActiveDay(0); }, [daysPerWeek]);

  return (
    <div>
      <div className="day-tabs">
        {dayGroups.map((_, i) => (
          <button key={i} className={`day-tab ${i === activeDay ? "active" : ""}`} onClick={() => setActiveDay(i)}>
            Day {i + 1}
          </button>
        ))}
      </div>
      <div className="ex-grid">
        {dayGroups[activeDay]?.map((ex) => (
          <ExerciseCard key={ex.id} ex={ex} onOpen={onOpen} done={!!logs[dayKeyFor(ex.id)]} />
        ))}
      </div>
    </div>
  );
}

  const [activeDay, setActiveDay] = useState(0);
  useEffect(() => { if (activeDay >= daysPerWeek) setActiveDay(0); }, [daysPerWeek]);

  const wk = WEEK_MULTIPLIERS[week];

  return (
    <div>
      <div className="week-nav">
        <button onClick={() => setWeek((w) => Math.max(0, w - 1))} disabled={week === 0}><ChevronLeft size={18} /></button>
        <div className="week-nav-label">
          <span className="week-nav-title">{wk.label} — {wk.tag}</span>
          <span className="week-nav-note">{wk.note}</span>
        </div>
        <button onClick={() => setWeek((w) => Math.min(3, w + 1))} disabled={week === 3}><ChevronRight size={18} /></button>
      </div>
      <div className="day-tabs">
        {dayGroups.map((_, i) => (
          <button key={i} className={`day-tab ${i === activeDay ? "active" : ""}`} onClick={() => setActiveDay(i)}>
            Day {i + 1}
          </button>
        ))}
      </div>
      <div className="ex-grid">
        {dayGroups[activeDay]?.map((ex) => (
          <ExerciseCard
            key={ex.id}
            ex={{ ...ex, sets: ex.sets + wk.setsAdd, reps: bumpReps(ex.reps, week) }}
            onOpen={(exWithWeek) => onOpen(exWithWeek)}
            done={!!logs[dayKeyFor(ex.id)]}
          />
        ))}
      </div>
    </div>
  );
}

function ProgressView({ logs }) {
  const entries = Object.entries(logs);
  const totalCompleted = entries.filter(([, v]) => v.completed).length;

  const byDate = {};
  entries.forEach(([key, v]) => {
    const date = key.split("_")[0];
    byDate[date] = (byDate[date] || 0) + 1;
  });
  const activeDays = Object.keys(byDate).sort();

  let streak = 0;
  let cursor = new Date();
  for (;;) {
    const iso = cursor.toISOString().slice(0, 10);
    if (byDate[iso]) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }

  const byCategory = CATEGORIES.map((cat) => {
    const count = entries.filter(([key]) => {
      const exId = key.split("_")[1];
      return EXERCISES.find((e) => e.id === exId)?.category === cat.id;
    }).length;
    return { ...cat, count };
  });
  const maxCat = Math.max(1, ...byCategory.map((c) => c.count));

  return (
    <div className="progress-view">
      <div className="stat-row">
        <div className="stat-card">
          <Flame size={20} />
          <div className="stat-num">{streak}</div>
          <div className="stat-label">Day streak</div>
        </div>
        <div className="stat-card">
          <CheckCircle2 size={20} />
          <div className="stat-num">{totalCompleted}</div>
          <div className="stat-label">Exercises logged</div>
        </div>
        <div className="stat-card">
          <Calendar size={20} />
          <div className="stat-num">{activeDays.length}</div>
          <div className="stat-label">Active days</div>
        </div>
      </div>

      <div className="cat-bars">
        {byCategory.map((c) => (
          <div className="cat-bar-row" key={c.id}>
            <span className="cat-bar-label"><CategoryDot id={c.id} />{c.label}</span>
            <div className="cat-bar-track">
              <div className="cat-bar-fill" style={{ width: `${(c.count / maxCat) * 100}%`, background: c.color }} />
            </div>
            <span className="cat-bar-count">{c.count}</span>
          </div>
        ))}
      </div>

      {activeDays.length === 0 && (
        <div className="empty-state">
          No sessions logged yet. Open any exercise and mark it complete to start tracking.
        </div>
      )}
    </div>
  );
}
